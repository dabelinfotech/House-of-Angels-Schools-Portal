<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – HOA Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(26,47,140,0.25) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 80%, rgba(204,24,24,0.12) 0%, transparent 60%);
    }
    .grid-overlay {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px; padding: 1rem;
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #1a2f8c, #3555c8);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 0 30px rgba(26,47,140,0.5);
    }
    .brand h1 { color: #fff; font-size: 1.1rem; font-weight: 700; }
    .brand p  { color: #94a3b8; font-size: 0.82rem; margin-top: 0.25rem; }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 2rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .card h2 { color: #f1f5f9; font-size: 1.3rem; font-weight: 700; margin-bottom: 0.3rem; }
    .card .sub { color: #64748b; font-size: 0.85rem; margin-bottom: 1.75rem; }
    .msg-box {
      display: none; align-items: flex-start; gap: 0.5rem;
      padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.2rem;
    }
    .msg-box.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .msg-box.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; color: #94a3b8; font-size: 0.82rem; font-weight: 500; margin-bottom: 0.5rem; }
    .input-wrap { position: relative; }
    .input-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #475569; pointer-events: none; }
    .input-wrap input {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      color: #f1f5f9; padding: 0.75rem 2.5rem 0.75rem 2.5rem;
      border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    .input-wrap input:focus { border-color: #3555c8; }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #475569; cursor: pointer; padding: 2px;
    }
    .eye-btn:hover { color: #94a3b8; }
    .strength-bar { height: 4px; border-radius: 2px; background: #1e3a5f; margin-top: 6px; transition: all 0.3s; }
    .strength-label { font-size: 0.72rem; color: #64748b; margin-top: 4px; }
    .btn {
      width: 100%; padding: 0.85rem;
      background: linear-gradient(135deg, #1a2f8c, #3555c8);
      color: #fff; border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back { text-align: center; margin-top: 1.2rem; }
    .back a { color: #94a3b8; font-size: 0.83rem; text-decoration: none; }
    .back a:hover { color: #cbd5e1; }
    #invalid-state { text-align:center; padding: 1.5rem 0; }
    #invalid-state svg { display: block; margin: 0 auto 1rem; }
    #invalid-state p { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="wrap">
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <h1>HOA Portal</h1>
      <p>House of Angel Schools</p>
    </div>

    <div class="card">
      <div id="loading-state" style="text-align:center;padding:2rem 0;color:#94a3b8">Verifying link…</div>

      <div id="invalid-state" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#ef4444" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/></svg>
        <p id="invalid-msg">This reset link is invalid or has expired.</p>
        <div class="back" style="margin-top:1.2rem"><a href="/admin/forgot-password">Request a new link</a></div>
      </div>

      <div id="form-state" style="display:none">
        <h2>Set New Password</h2>
        <p class="sub" id="greeting-sub">Choose a new secure password for your account.</p>

        <div class="msg-box error" id="err-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="err-text"></span>
        </div>
        <div class="msg-box success" id="ok-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="ok-text"></span>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label>New Password</label>
            <div class="input-wrap">
              <span class="icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/></svg>
              </span>
              <input type="password" id="new-password" placeholder="Minimum 6 characters" required autocomplete="new-password" oninput="checkStrength(this.value)">
              <button type="button" class="eye-btn" onclick="togglePwd('new-password',this)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
              </button>
            </div>
            <div class="strength-bar" id="strength-bar"></div>
            <div class="strength-label" id="strength-label"></div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-wrap">
              <span class="icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/></svg>
              </span>
              <input type="password" id="confirm-password" placeholder="Repeat password" required autocomplete="new-password">
              <button type="button" class="eye-btn" onclick="togglePwd('confirm-password',this)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn" id="submit-btn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 6l-11 11-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span id="btn-text">Update Password</span>
            <span id="btn-spin" style="display:none"><span class="spinner"></span></span>
          </button>
        </form>
      </div>

      <div class="back" id="back-link" style="display:none"><a href="/admin">← Back to Login</a></div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function checkStrength(val) {
      const bar   = document.getElementById('strength-bar');
      const label = document.getElementById('strength-label');
      if (!val) { bar.style.width = '0'; bar.style.background = '#1e3a5f'; label.textContent = ''; return; }
      let score = 0;
      if (val.length >= 8)  score++;
      if (val.length >= 12) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { pct:'20%', color:'#ef4444', text:'Very weak' },
        { pct:'40%', color:'#f97316', text:'Weak' },
        { pct:'60%', color:'#eab308', text:'Fair' },
        { pct:'80%', color:'#22c55e', text:'Strong' },
        { pct:'100%',color:'#16a34a', text:'Very strong' },
      ];
      const lvl = levels[Math.min(score, 4)];
      bar.style.width    = lvl.pct;
      bar.style.background = lvl.color;
      label.style.color  = lvl.color;
      label.textContent  = lvl.text;
    }

    async function init() {
      if (!token) { showInvalid('No reset token found in the URL.'); return; }
      try {
        const res  = await fetch(`/api/auth/verify-reset-token/${token}`);
        const data = await res.json();
        if (!data.valid) { showInvalid(data.message); return; }
        document.getElementById('greeting-sub').textContent =
          `Hello ${data.name}. Choose a new secure password for your account.`;
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('form-state').style.display    = 'block';
        document.getElementById('back-link').style.display     = 'block';
      } catch (e) {
        showInvalid('Could not verify reset link.');
      }
    }

    function showInvalid(msg) {
      document.getElementById('loading-state').style.display  = 'none';
      document.getElementById('invalid-msg').textContent      = msg;
      document.getElementById('invalid-state').style.display  = 'block';
    }

    document.getElementById('reset-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirm  = document.getElementById('confirm-password').value;
      const errBox   = document.getElementById('err-box');
      const okBox    = document.getElementById('ok-box');

      errBox.style.display = 'none';
      okBox.style.display  = 'none';

      if (password !== confirm) {
        document.getElementById('err-text').textContent = 'Passwords do not match.';
        errBox.style.display = 'flex'; return;
      }
      if (password.length < 6) {
        document.getElementById('err-text').textContent = 'Password must be at least 6 characters.';
        errBox.style.display = 'flex'; return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      document.getElementById('btn-text').style.display = 'none';
      document.getElementById('btn-spin').style.display = 'flex';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('ok-text').textContent = data.message;
          okBox.style.display = 'flex';
          document.getElementById('reset-form').style.display = 'none';
          setTimeout(() => { window.location.href = '/admin'; }, 2500);
        } else {
          document.getElementById('err-text').textContent = data.message || 'Something went wrong.';
          errBox.style.display = 'flex';
        }
      } catch (err) {
        document.getElementById('err-text').textContent = 'Connection error. Please try again.';
        errBox.style.display = 'flex';
      } finally {
        btn.disabled = false;
        document.getElementById('btn-text').style.display = 'inline';
        document.getElementById('btn-spin').style.display = 'none';
      }
    });

    init();
  </script>
</body>
</html>
