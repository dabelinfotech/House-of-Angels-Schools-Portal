<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – HOA Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(26,47,140,0.25) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 80%, rgba(204,24,24,0.12) 0%, transparent 60%);
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #1a2f8c, #3555c8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 0 30px rgba(26,47,140,0.5);
    }
    .brand h1 { color: #fff; font-size: 1.1rem; font-weight: 700; }
    .brand p  { color: #94a3b8; font-size: 0.82rem; margin-top: 0.25rem; }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .card h2 { color: #f1f5f9; font-size: 1.3rem; font-weight: 700; margin-bottom: 0.3rem; }
    .card .sub { color: #64748b; font-size: 0.85rem; margin-bottom: 1.75rem; }
    .msg-box {
      display: none;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }
    .msg-box.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .msg-box.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; color: #94a3b8; font-size: 0.82rem; font-weight: 500; margin-bottom: 0.5rem; }
    .input-wrap { position: relative; }
    .input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #475569; pointer-events: none; }
    .input-wrap input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: border-color 0.2s;
      outline: none;
    }
    .input-wrap input:focus { border-color: #3555c8; }
    .btn {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #1a2f8c, #3555c8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back { text-align: center; margin-top: 1.2rem; }
    .back a { color: #94a3b8; font-size: 0.83rem; text-decoration: none; }
    .back a:hover { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="wrap">
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="#fff" stroke-width="2"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="#fff" stroke-width="2"/></svg>
      </div>
      <h1>HOA Portal</h1>
      <p>House of Angel Schools</p>
    </div>

    <div class="card">
      <h2>Forgot Password?</h2>
      <p class="sub">Enter your email address and we'll send you a reset link.</p>

      <div class="msg-box error" id="err-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="err-text"></span>
      </div>
      <div class="msg-box success" id="ok-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="ok-text"></span>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M2 7l10 7 10-7" stroke="currentColor" stroke-width="2"/></svg>
            <input type="email" id="email-input" placeholder="your@email.com" required autocomplete="email">
          </div>
        </div>
        <button type="submit" class="btn" id="submit-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="btn-text">Send Reset Link</span>
          <span id="btn-spin" style="display:none"><span class="spinner"></span></span>
        </button>
      </form>

      <div class="back">
        <a href="/admin">← Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email-input').value.trim();
      const errBox = document.getElementById('err-box');
      const okBox  = document.getElementById('ok-box');
      const btn    = document.getElementById('submit-btn');

      errBox.style.display = 'none';
      okBox.style.display  = 'none';
      btn.disabled = true;
      document.getElementById('btn-text').style.display = 'none';
      document.getElementById('btn-spin').style.display = 'flex';

      try {
        const res  = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('ok-text').textContent = data.message;
          okBox.style.display = 'flex';
          document.getElementById('forgot-form').style.display = 'none';
        } else {
          document.getElementById('err-text').textContent = data.message || 'Something went wrong.';
          errBox.style.display = 'flex';
        }
      } catch (err) {
        document.getElementById('err-text').textContent = 'Connection error. Please try again.';
        errBox.style.display = 'flex';
      } finally {
        btn.disabled = false;
        document.getElementById('btn-text').style.display = 'inline';
        document.getElementById('btn-spin').style.display = 'none';
      }
    });
  </script>
</body>
</html>
